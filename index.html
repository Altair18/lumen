<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4E6B56">
<meta name="description" content="A dusk moth lives in your lantern. Tiny cares, stories, and a nest that stays warm.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gloam">
<title>Gloam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--cream:#F4EEE6;--ink:#2C2A26;--mute:#7A7468;--sage:#4E6B56;--sage2:#5B7A62;--paper:#FFFaf4;--line:#E7E0D4;--chip:#E8E2D6}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif}
body{max-width:26rem;margin:0 auto;min-height:100dvh;padding:1.1rem 1.15rem 5.6rem}
.brand{font-size:.92rem;color:var(--mute);margin:0 0 1.4rem}
.hero{width:100%;border-radius:1.35rem;overflow:hidden;background:#e8dfd2;aspect-ratio:1.15/1;object-fit:cover;display:block;margin:0 auto 1.15rem}
h1{font-size:1.85rem;letter-spacing:-.02em;line-height:1.15;margin:.2rem 0 .45rem;font-weight:600}
.lead{color:var(--mute);font-size:1.02rem;line-height:1.45;margin:0 0 1.4rem}
button.primary{width:100%;border:0;background:var(--sage);color:#fff;font:inherit;font-size:1.05rem;padding:.95rem 1rem;border-radius:999px;cursor:pointer}
button.ghost,button.chip{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:.55rem .9rem;font:inherit;cursor:pointer}
button.chip.on{background:var(--sage);color:#fff}
.legal{text-align:center;color:var(--mute);font-size:.85rem;margin-top:1.1rem}
.legal a{color:var(--sage);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.traits{color:var(--mute);font-size:.88rem;margin:.15rem 0 0}
.leaf{width:2.4rem;height:2.4rem;border-radius:99px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--sage);text-decoration:none}
.say{background:var(--paper);border-radius:1.2rem;padding:.85rem 1rem;line-height:1.4;margin:.2rem 0 1rem}
.meter{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.bar{display:flex;gap:.35rem;margin:.35rem 0 .35rem}
.bar i{flex:1;height:.42rem;border-radius:99px;background:#ddd6c8}
.bar i.on{background:var(--sage)}
.hint{text-align:center;color:var(--mute);font-size:.88rem;margin:0 0 1.1rem}
.section{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 .45rem}
.weather{background:var(--paper);border-radius:1.2rem;padding:.7rem;display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:.4rem 0 .5rem}
.goal{background:var(--paper);border-radius:1.15rem;padding:.85rem 1rem;margin:.45rem 0;display:flex;gap:.75rem;align-items:flex-start;cursor:pointer}
.ring{width:1.35rem;height:1.35rem;border-radius:99px;border:2px solid #c9c2b4;flex:none;margin-top:.1rem}
.goal.done .ring{background:var(--sage);border-color:var(--sage)}
.goal small{display:block;color:var(--mute);font-size:.82rem;margin-top:.15rem}
nav.tab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(26rem,100%);background:var(--cream);display:flex;justify-content:space-around;padding:.45rem .2rem calc(.55rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav.tab button{background:none;border:0;color:var(--mute);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:.15rem}
nav.tab button.on{color:var(--ink)}
input[type=text]{width:100%;padding:.75rem .85rem;border-radius:.9rem;border:1px solid var(--line);font:inherit;background:var(--paper);margin:.4rem 0 1rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='gloam-nest-v2';
const GOALS=[
 {id:'bed',t:'Get in bed 15 minutes earlier',s:'Rest'},
 {id:'water',t:'Drink a glass of water',s:'Fuel'},
 {id:'read',t:'Read one page of anything',s:'Mind'},
 {id:'jaw',t:'Unclench your jaw',s:'Body'},
 {id:'window',t:'Open a window for one minute',s:'Air'}
];
const SAY=[
 'I live in the lantern now. I kept a little warmth going while you answered. We can do tiny things. That is plenty.',
 'Glad you came back. The wick is still here.',
 'Three small cares fill the lantern. Then I can slip out for a look.',
 'Missed days stay kind. I was not counting.'
];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
const day=()=>new Date().toISOString().slice(0,10);
function seed(){const s=load();s.energy=s.energy||0;s.sparks=s.sparks||0;s.done=s.done||{};s.weather=s.weather||'';s.journal=s.journal||[];s.traits=s.traits||['Silly','Observant','Warm'];save(s);return s}
let screen='today';
const art='<img class="hero" alt="A dusk moth in a warm lantern" src="icons/icon-512.png" onerror="this.style.background=\'#e8dfd2\';this.alt=\'\';this.src=\'\'" />';
function mark(id){const s=seed();const d=day();s.done[d]=s.done[d]||[];const i=s.done[d].indexOf(id);if(i>=0)s.done[d].splice(i,1);else{s.done[d].push(id);s.energy=Math.min(3,s.energy+1);s.sparks+=5}save(s);draw()}
function hatch(){const s=seed();s.hatched=true;s.name=(document.getElementById('nm').value||'').trim()||'Pip';save(s);draw()}
function draw(){
 const s=seed();const el=document.getElementById('app');
 if(!s.hatched){
  if(screen!=='name'){
   el.innerHTML='<p class="brand">Gloam</p>'+art+'<h1>Someone small is waiting.</h1><p class="lead">A gloam. A dusk moth. You keep them by keeping yourself. Tiny things. No streaks to break.</p><button class="primary" onclick="screen=\'name\';draw()">Open the lantern</button><p class="legal">Ages 13+. <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>';
   return;
  }
  el.innerHTML='<p class="brand">Gloam</p>'+art+'<h1>What shall we call them?</h1><p class="lead">A small name is enough.</p><input id="nm" type="text" value="Pip" maxlength="18"><button class="primary" onclick="hatch()">They can stay</button>';
  return;
 }
 const done=s.done[day()]||[];
 let body='';
 if(screen==='today'){
  body='<div class="top"><div><h1 style="margin:0;font-size:1.7rem">'+s.name+'</h1><p class="traits">Hatchling · '+s.traits.join(' · ')+'</p></div><a class="leaf" href="#" onclick="screen=\'care\';draw();return false">✎</a></div>'
   +art+'<div class="say">I\'m '+s.name+'. '+SAY[Math.min(s.energy,SAY.length-1)]+'</div>'
   +'<div class="meter"><span>Lantern</span><span>'+s.energy+'/3</span></div><div class="bar">'+[0,1,2].map(i=>'<i class="'+(i<s.energy?'on':'')+'"></i>').join('')+'</div>'
   +'<p class="hint">'+(s.energy>=3?'The lantern is full. Send them into the dusk.':'Fill the lantern to send them into the dusk.')+'</p>'
   +(s.energy>=3?'<p><button class="primary" onclick="const x=seed();x.energy=0;save(x);alert(x.name+\' slipped toward the bakery window and brought a warm crumb of a story home.\');draw()">Send them out</button></p>':'')
   +'<p class="section">Weather inside</p><div class="weather">'+['Heavy','Tender','Steady','Light','Glowing'].map(w=>'<button class="chip '+(s.weather===w?'on':'')+'" onclick="const x=seed();x.weather=\''+w+'\';save(x);draw()">'+w+'</button>').join('')+'</div>'
   +'<div class="row"><h2 style="margin:0">Today</h2><span class="traits">'+s.sparks+' sparks</span></div>'
   +GOALS.map(g=>'<div class="goal '+(done.includes(g.id)?'done':'')+'" onclick="mark(\''+g.id+'\')"><i class="ring"></i><div>'+g.t+'<small>'+g.s+'</small></div></div>').join('');
 } else if(screen==='goals'){
  body='<h1>Goals</h1><p class="lead">Tiny cares you already know.</p>'+GOALS.map(g=>'<div class="goal"><div>'+g.t+'<small>'+g.s+'</small></div></div>').join('');
 } else if(screen==='nest'){
  body='<h1>Nest</h1><p class="lead">Starter cloth is already yours.</p><div class="say">Lantern+ is extra cloth. Monthly £2.99 · yearly £24.99 on Google Play. The daily loop never locks.</div>';
 } else if(screen==='journal'){
  body='<h1>Journal</h1><p class="lead">One true sentence.</p><input id="j" type="text" placeholder="Keep this"><button class="primary" onclick="const x=seed();const t=document.getElementById(\'j\').value.trim();if(t){x.journal.unshift({d:day(),t:t});save(x)}draw()">Keep this</button>'+(s.journal||[]).slice(0,6).map(n=>'<div class="say"><small>'+n.d+'</small><div>'+String(n.t).replace(/</g,'')+'</div></div>').join('');
 } else {
  body='<h1>Care</h1><div class="say"><strong>Breathe.</strong> In for four. Hold for two. Out for six.</div><div class="say"><strong>First aid.</strong> Comfort, not treatment. Drink water. Sit down. Name five things you can see.</div><p class="legal">Crisis: US 988 · <a href="https://www.iasp.info/suicidalthoughts/">IASP</a><br><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="support.html">Support</a></p><p><button class="ghost" onclick="if(confirm(\'Erase this nest?\')){localStorage.removeItem(KEY);location.reload()}">Erase this nest</button></p>';
 }
 const tabs=[['today','Today'],['goals','Goals'],['nest','Nest'],['journal','Journal'],['care','Care']];
 el.innerHTML=body+'<nav class="tab">'+tabs.map(t=>'<button class="'+(screen===t[0]?'on':'')+'" onclick="screen=\''+t[0]+'\';draw()">'+t[1]+'</button>').join('')+'</nav>';
}
draw();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
